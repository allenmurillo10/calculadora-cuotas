<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Calculadora de Cuota</title>
 
<style>
 
body{
font-family: Arial, sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}
 
.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 3px 15px rgba(0,0,0,.15);
}
 
h1{
text-align:center;
color:#2d5f3f;
}
 
label{
display:block;
margin-top:15px;
font-weight:bold;
}
 
input[type=number],
select{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}
 
.check{
margin-top:15px;
}
 
button{
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:10px;
background:#2d5f3f;
color:white;
font-size:18px;
cursor:pointer;
}
 
button:hover{
background:#234b32;
}
 
.resultado{
margin-top:20px;
background:#eef7e8;
padding:20px;
border-radius:10px;
}
 
.total{
font-size:32px;
font-weight:bold;
color:#2d5f3f;
text-align:center;
margin-top:15px;
}
 
</style>
</head>
 
<body>
 
<div class="container">
 
<h1>Calculadora de Cuota Propuesta</h1>
 
<label>Área del lote (m²)</label>
<input type="number" id="area" placeholder="Ej: 7838">
 
<label>Tipo de propiedad</label>
<select id="propiedad">
<option value="3000">Lote desocupado</option>
<option value="15000">1 vivienda</option>
<option value="36000">2 viviendas</option>
</select>
 
<div class="check">
<input type="checkbox" id="piscina">
Piscina (+ ₡15,000)
</div>
 
<label>Caballeriza</label>
<select id="caballeriza">
<option value="0">Ninguna</option>
<option value="15000">Caballeriza S (-3)</option>
<option value="30000">Caballeriza M (-7)</option>
<option value="60000">Caballeriza L (-14)</option>
</select>
 
<div class="check">
<input type="checkbox" id="comercial">
Actividad Comercial (+ ₡90,000)
</div>
 
<button onclick="calcular()">
Calcular mi cuota
</button>
 
<div class="resultado">
 
<p><strong>Componente área:</strong> <span id="areaMonto">₡0</span></p>
 
<p><strong>Características:</strong> <span id="extrasMonto">₡0</span></p>
 
<p><strong>Fondo emergencia (5%):</strong> <span id="emergenciaMonto">₡0</span></p>
 
<hr>
 
<div id="total" class="total">
₡0
</div>
 
</div>
 
</div>
 
<script>
 
function colones(valor){
return "₡" + Math.round(valor).toLocaleString("es-CR");
}
 
function calcular(){
 
let area =
Number(document.getElementById("area").value);
 
if(!area){
alert("Ingrese el área del lote.");
return;
}
 
const referencias = [5000,7500,10000];
const cuotas = [60000,90000,120000];
 
let indice = 0;
let menor = Infinity;
 
referencias.forEach((ref,i)=>{
let distancia = Math.abs(area-ref);
 
if(distancia < menor){
menor = distancia;
indice = i;
}
});
 
let componenteArea = cuotas[indice];
 
let propiedad =
Number(document.getElementById("propiedad").value);
 
let piscina =
document.getElementById("piscina").checked
? 15000 : 0;
 
let caballeriza =
Number(document.getElementById("caballeriza").value);
 
let comercial =
document.getElementById("comercial").checked
? 90000 : 0;
 
let extras =
propiedad +
piscina +
caballeriza +
comercial;
 
let emergencia =
componenteArea * 0.05;
 
let total =
componenteArea +
extras +
emergencia;
 
document.getElementById("areaMonto").innerText =
colones(componenteArea);
 
document.getElementById("extrasMonto").innerText =
colones(extras);
 
document.getElementById("emergenciaMonto").innerText =
colones(emergencia);
 
document.getElementById("total").innerText =
"TOTAL: " + colones(total);
}
 
</script>
 
</body>
</html>
